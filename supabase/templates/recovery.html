<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Reset your Ivoire Shop password</title>
  </head>
  <body style="margin:0;padding:0;background:#f7f1e8;font-family:Georgia,'Times New Roman',serif;color:#173f35">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:24px 12px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#fffaf3;border:1px solid #eadfce;border-radius:24px">
            <tr>
              <td style="padding:28px">
                <p style="margin:0;letter-spacing:0.28em;text-transform:uppercase;color:#b8964c;font-size:12px">Ivoire Shop</p>
                <h1 style="margin:12px 0 0;font-size:28px;line-height:1.2">Reset your password</h1>
                <p style="margin:16px 0 0;font-size:16px;line-height:1.5;color:#6b6b6b">
                  We received a request to reset the password for your Ivoire Shop account. Use the button below to choose a new password.
                </p>
                <p style="margin:24px 0 0">
                  <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#173f35;color:#fffaf3;text-decoration:none;padding:14px 22px;border-radius:12px;font-weight:600">
                    Choose a new password
                  </a>
                </p>
                <p style="margin:24px 0 0;font-size:13px;line-height:1.5;color:#6b6b6b">
                  This link expires for your security. If you did not request a reset, you can ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
